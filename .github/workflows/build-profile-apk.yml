name: Build Profile APK

# Builds the `profile` build type (non-debuggable but profileable, signed with the auto-generated
# debug keystore) on every push to main and publishes the APK as a downloadable artifact.
# The profile variant needs no signing secrets.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Only keep the latest build for a given ref running — cancel superseded pushes.
concurrency:
  group: build-profile-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-profile-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 9.x / AGP 9.x require JDK 21 — JDK 17 fails to start the daemon.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # packages: '' desactiva el default de la acción (`tools platform-tools`). El paquete `tools`
      # ya no existe en el repo de Google y `sdkmanager tools` falla con exit 1. Los paquetes que
      # realmente necesitamos se instalan en el step siguiente.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # Ensure the compileSdk platform + build-tools are present.
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # google-services.json is gitignored, but the google-services plugin fails the build without
      # it, so CI writes it back from a base64 repo secret. Keep the secret in sync with the file
      # whenever the Firebase app changes.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON secret — add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      # -PappMinor=<run_number> makes the versionName MINOR auto-increment (+1 per push to main).
      - name: Assemble profile APK
        run: ./gradlew assembleProfile -PappMinor=${{ github.run_number }} --stacktrace

      - name: Upload profile APK
        uses: actions/upload-artifact@v4
        with:
          name: qhathia-staff-profile-apk
          path: app/build/outputs/apk/profile/*.apk
          if-no-files-found: error
          retention-days: 30
